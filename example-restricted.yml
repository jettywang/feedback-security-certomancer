# Public-only Certomancer deployment example for a shared test service.
#
# Start it with:
#   certomancer --config example-restricted.yml animate --no-web-ui
#
# Or expose it through the WSGI entrypoint (uWSGI/gunicorn) with:
#   CERTOMANCER_RESTRICTED=1
#
# Allowed:  certificates, CRLs, OCSP responses, time stamps.
# Denied:   PKCS#12/PFX, ZIP bundles containing PFX, plugin endpoints,
#           and the CLI/PKCS#11 export commands.
restricted-mode:
  enabled: true
  allow-plugins: false

external-url-prefix: "http://localhost:9001"

keysets:
  testing-ca:
    path-prefix: tests/data/keys-rsa
    keys:
      root:
        path: root.key.pem
        password: secret
      interm:
        path: interm.key.pem
        password: secret
      interm-ocsp:
        path: interm-ocsp.key.pem
        password: secret
      tsa:
        path: tsa.key.pem
        password: secret
      signer1:
        path: signer.key.pem
        password: secret

pki-architectures:
  testing-ca:
    keyset: testing-ca
    entity-defaults:
      country-name: BE
      organization-name: Shared Test PKI
    entities:
      root:
        common-name: Root CA
      interm:
        common-name: Intermediate CA
      interm-ocsp:
        common-name: OCSP responder
      tsa:
        common-name: Time Stamping Authority
      signer1:
        organizational-unit-name: Signers
        common-name: Alice
    certs:
      root:
        subject: root
        subject-key: root
        issuer: root
        authority-key: root
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2500-01-01T00:00:00+0000"
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_cert_sign, crl_sign]
      interm:
        issuer: root
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2100-01-01T00:00:00+0000"
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
              path-len-constraint: 0
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_cert_sign, crl_sign]
          - id: crl_distribution_points
            smart-value:
              schema: crl-dist-url
              params: {crl-repo-names: [root]}
      interm-ocsp:
        issuer: interm
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2100-01-01T00:00:00+0000"
        extensions:
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature]
          - id: extended_key_usage
            critical: true
            value: [ocsp_signing]
          - id: ocsp_no_check
      tsa:
        issuer: root
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2030-01-01T00:00:00+0000"
        extensions:
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature]
          - id: extended_key_usage
            critical: true
            value: [time_stamping]
      signer1:
        issuer: interm
        validity:
          valid-from: "2020-01-01T00:00:00+0000"
          valid-to: "2025-01-01T00:00:00+0000"
        extensions:
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature]
          - id: subject_alt_name
            smart-value:
              schema: general-names
              params:
                - {type: email, value: alice@example.com}
    services:
      ocsp:
        interm:
          for-issuer: interm
          responder-cert: interm-ocsp
          signing-key: interm-ocsp
      crl-repo:
        root:
          for-issuer: root
          signing-key: root
          simulated-update-schedule: "P90D"
        interm:
          for-issuer: interm
          signing-key: interm
          simulated-update-schedule: "P30D"
      cert-repo:
        root:
          for-issuer: root
          publish-issued-certs: yes
      time-stamping:
        tsa:
          signing-key: tsa
          signing-cert: tsa
