external-url-prefix: http://test.test
keysets:
  testing-ca:
    path-prefix: keys-ecdsa
    default-password: secret
    keys:
      ca:
        path: root.key.pem
      signer:
        path: signer.key.pem
      signer2:
        path: signer2.key.pem
pki-architectures:
  testing-ca:
    entity-defaults:
      country-name: BE
      organization-name: Testing Authority
    entities:
      ca:
        common-name: CA
      signer:
        organizational-unit-name: Signers
        common-name: Alice
      signer2:
        organizational-unit-name: Signers
        common-name: Bob
    certs:
      ca:
        subject: ca
        issuer: ca
        validity:
          valid-from: 2000-01-01T00:00:00+0000
          valid-to: 2500-01-01T00:00:00+0000
        extensions:
        - id: basic_constraints
          critical: true
          value:
            ca: true
        - id: key_usage
          critical: true
          smart-value:
            schema: key-usage
            params:
            - digital_signature
            - key_cert_sign
            - crl_sign
      signer:
        issuer: ca
        validity:
          valid-from: 2020-01-01T00:00:00+0000
          valid-to: 2030-01-01T00:00:00+0000
        revocation:
          revoked-since: 2021-01-01T00:00:00+0000
          reason: key_compromise
        extensions:
        - id: key_usage
          critical: true
          smart-value:
            schema: key-usage
            params:
            - digital_signature
            - non_repudiation
        certificate-file: serial-of-signer2.pem
        allow-import-mismatch: true
      signer2:
        subject: signer2
        issuer: ca
        serial: 4097
        validity:
          valid-from: 2020-01-01T00:00:00+0000
          valid-to: 2030-01-01T00:00:00+0000
        extensions:
        - id: key_usage
          critical: true
          smart-value:
            schema: key-usage
            params:
            - digital_signature
    services:
      ocsp:
        ca:
          for-issuer: ca
          responder-cert: ca
          signing-key: ca
      crl-repo:
        ca:
          for-issuer: ca
          signing-key: ca
          simulated-update-schedule: P30D
