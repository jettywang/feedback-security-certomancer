external-url-prefix: "http://test.test"
keysets:
  testing-ca:
    path-prefix: keys-rsa
    keys:
      root:
        path: root.key.pem
        password: secret
      interm:
        path: interm.key.pem
        password: secret
      signer1:
        path: signer.key.pem
        password: secret
      signer2:
        path: signer2.key.pem
        password: secret
      signer3:
        path: tsa.key.pem
        password: secret

pki-architectures:
  testing-ca:
    keyset: testing-ca
    entity-defaults:
      country-name: BE
      organization-name: Testing Authority
    entities:
      root:
        common-name: Root CA
      interm:
        common-name: Intermediate CA
      signer1:
        organizational-unit-name: Signers
        common-name: Alice
      signer2:
        organizational-unit-name: Signers
        common-name: Bob
      signer3:
        organizational-unit-name: Signers
        common-name: Carol
    certs:
      root:
        subject: root
        issuer: root
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2500-01-01T00:00:00+0000"
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_cert_sign, crl_sign]
      interm:
        issuer: root
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2100-01-01T00:00:00+0000"
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
              path-len-constraint: 0
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_cert_sign, crl_sign]
      signer1:
        issuer: interm
        validity:
          valid-from: "2020-01-01T00:00:00+0000"
          valid-to: "2030-01-01T00:00:00+0000"
        extensions:
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature]
          - id: crl_distribution_points
            smart-value:
              schema: crl-dist-url
              params: {crl-repo-names: [interm]}
      signer2:
        template: signer1
        revocation:
          revoked-since: "2020-10-20T00:00:00+0000"
          reason: key_compromise
      signer3:
        template: signer1
        revocation:
          revoked-since: "2020-11-20T00:00:00+0000"
          reason: key_compromise
    services:
      crl-repo:
        interm:
          for-issuer: interm
          signing-key: interm
          simulated-update-schedule: "P30D"
          delta-crl:
            base-crl-number: 253
            issuance-period: "P10D"
