external-url-prefix: "http://test.test"
plugin-modules: ["scep_plugin"]
keysets:
  testing-ca:
    path-prefix: keys-rsa
    keys:
      root:
        path: root.key.pem
        password: secret
      interm:
        path: interm.key.pem
        password: secret
      signer1:
        path: signer.key.pem
        password: secret
      signer2:
        path: signer2.key.pem
        password: secret

pki-architectures:
  testing-ca:
    keyset: testing-ca
    entity-defaults:
      country-name: BE
      organization-name: Testing Authority
    entities:
      root:
        common-name: Root CA
      interm:
        common-name: Intermediate CA
      signer1:
        organizational-unit-name: Signers
        common-name: Alice
      signer2:
        organizational-unit-name: Signers
        common-name: Bob
    certs:
      root:
        issuer: root
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2500-01-01T00:00:00+0000"
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_cert_sign, crl_sign]
      interm:
        issuer: root
        validity:
          valid-from: "2000-01-01T00:00:00+0000"
          valid-to: "2100-01-01T00:00:00+0000"
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
              path-len-constraint: 0
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_cert_sign, crl_sign]
      # the single certificate the SCEP service is allowed to hand out
      scep-target:
        subject: signer1
        subject-key: signer1
        issuer: interm
        issuer-cert: interm
        validity:
          valid-from: "2020-01-01T00:00:00+0000"
          valid-to: "2100-01-01T00:00:00+0000"
        extensions:
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_encipherment]
      # RA/CA identity signing SCEP responses and decrypting requests
      scep-ra:
        subject: interm
        subject-key: interm
        issuer: interm
        issuer-cert: interm
        validity:
          valid-from: "2020-01-01T00:00:00+0000"
          valid-to: "2100-01-01T00:00:00+0000"
        extensions:
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_encipherment]
      # an unrelated certificate/key used to prove cross-transaction
      # rejection in the tests
      other-client:
        subject: signer2
        subject-key: signer2
        issuer: interm
        issuer-cert: interm
        validity:
          valid-from: "2020-01-01T00:00:00+0000"
          valid-to: "2100-01-01T00:00:00+0000"
        extensions:
          - id: key_usage
            critical: true
            smart-value:
              schema: key-usage
              params: [digital_signature, key_encipherment]
    services:
      plugin:
        scep-responder:
          immediate:
            target-cert: scep-target
            responder-cert: scep-ra
            responder-key: interm
            recipient-cert: scep-ra
            recipient-key: interm
            pending-first: false
          pending:
            target-cert: scep-target
            responder-cert: scep-ra
            responder-key: interm
            recipient-cert: scep-ra
            recipient-key: interm
            pending-first: true
